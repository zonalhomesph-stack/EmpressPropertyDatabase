name: Daily listing cards
on:
  schedule:
    - cron: '7 22 * * *'   # 6:07 AM Manila time, every day
  workflow_dispatch: {}      # also allows "Run workflow" button
permissions:
  contents: write
jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node scripts/daily-cards.mjs
        env:
          CARD_COUNT: ${{ vars.CARD_COUNT || '5' }}
          CARD_PHONE: ${{ vars.CARD_PHONE || '0976-339-8960' }}
          CARD_AGENT: ${{ vars.CARD_AGENT || 'Florence Alvarez' }}
      - name: Save cards to repo
        run: |
          git config user.name "EPD Daily Cards"
          git config user.email "actions@users.noreply.github.com"
          git add daily-cards
          git diff --cached --quiet || git commit -m "Daily cards $(TZ=Asia/Manila date +%F)"
          git push
