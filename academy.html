<!DOCTYPE html>
<html lang="tl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Empress Academy</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#1c2b2a;--mute:#5d6b69;--line:#d9d6cc;--pri:#0f5c56;--ok:#1e7a45;--okbg:#e3f3e9;--bad:#b3362b;--badbg:#f9e4e1;--lock:#9aa3a1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141c1b;--card:#1d2827;--ink:#eaf0ee;--mute:#9db0ac;--line:#33423f;--pri:#4fc3b8;--okbg:#17382a;--badbg:#3d1f1b;--ok:#6fd49a;--bad:#ff8f84;--lock:#667572}}
:root[data-theme="dark"]{--bg:#141c1b;--card:#1d2827;--ink:#eaf0ee;--mute:#9db0ac;--line:#33423f;--pri:#4fc3b8;--okbg:#17382a;--badbg:#3d1f1b;--ok:#6fd49a;--bad:#ff8f84;--lock:#667572}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font:700 1.7rem/1.2 Georgia,"Times New Roman",serif;margin:8px 0 6px}
.sub{color:var(--mute);margin:0 0 20px}
.levels{display:grid;gap:10px;margin-bottom:22px}
.lv{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:14px 16px;text-align:left;width:100%;color:var(--ink);font:inherit;cursor:pointer}
.lv[disabled]{color:var(--lock);cursor:not-allowed;background:transparent}
.lv b{display:block}.lv small{color:var(--mute)}
.lv .st{margin-left:auto;font-size:.85rem;font-weight:600}
.lv.done{border-color:var(--ok)}.lv.done .st{color:var(--ok)}
.lv:focus-visible,button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.bar{height:6px;background:var(--line);border-radius:3px;margin:10px 0 18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem}
.tag{display:inline-block;font-size:.8rem;font-weight:600;border:1px solid var(--line);border-radius:99px;padding:1px 10px;color:var(--mute);margin-bottom:8px}
.q{font:600 1.15rem/1.45 Georgia,serif;margin:4px 0 16px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 9px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--pri)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.no{background:var(--badbg);border-color:var(--bad)}
.exp{line-height:1.6;border-left:4px solid var(--pri);background:var(--card);padding:10px 14px;margin:14px 0;border-radius:0 8px 8px 0}
.btn{font:inherit;font-weight:600;background:var(--pri);color:var(--bg);border:0;border-radius:10px;padding:12px 22px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.res{text-align:center;padding:12px 0}.res .n{font:700 3.2rem/1 Georgia,serif}
.note{color:var(--mute);font-size:.88rem;margin-top:26px}
.rev{margin:16px 0;padding:0;list-style:none}.rev li{padding:8px 0;border-top:1px solid var(--line)}
.cert{overflow:hidden;background:#fffdf8;color:#1b2340;border:2px solid #c9a227;outline:5px solid #b3121f;outline-offset:-13px;border-radius:6px;padding:34px 24px 28px;text-align:center;margin:8px 0 18px;position:relative}
.cert>*{position:relative;z-index:1}.cert .wm{position:absolute;z-index:0;left:50%;top:50%;width:72%;transform:translate(-50%,-50%);opacity:.10;pointer-events:none}
.cert .logos{display:flex;justify-content:center;margin:0 0 6px}.cert .logos img.z{height:26px}
.cert .k{letter-spacing:.3em;font-size:.7rem;font-weight:700;color:#b3121f}
.cert h2{font:700 1.3rem/1.15 Georgia,serif;margin:6px 0 4px;color:#b3121f}
.cert .rule{width:70px;height:2px;background:#c9a227;margin:8px auto}
.cert .nm{font:italic 700 2.1rem/1.2 Georgia,serif;margin:12px 0 6px;color:#1b2340;border-bottom:1.5px solid #c9a227;display:inline-block;padding:0 14px 6px}
.cert .lvls{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:12px 0}
.cert .lvls span{border:1px solid #b3121f;color:#b3121f;border-radius:99px;padding:3px 11px;font-size:.75rem;font-weight:600}
.cert .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:22px;font-size:.78rem}
.cert .sg{flex:1.3}.cert .sg img{height:62px;display:block;margin:0 auto -8px}
.cert .sg div{border-top:1px solid #1b2340;padding-top:5px}
.cert .dt{flex:1;text-align:center}.cert .dt b{display:block;color:#1b2340;font-size:.82rem}
.cert .no{margin-top:14px;font-size:.68rem;color:#6b7080;letter-spacing:.05em}
</style></head><body><main id="app"></main>

const L=[
{name:"Basic",desc:"Product at computation basics",qs:[
{q:"Ano ang pagkakaiba ng RFO at Pre-selling?",o:["Ang RFO ay Ready for Occupancy; ang Pre-selling ay binebenta habang under development o hindi pa tapos","Ang RFO ay hindi pa nagagawa; ang Pre-selling ay ready to move in","Pareho silang fully completed na","Ang RFO ay para lang sa cash buyers"],a:0,e:"RFO = puwede nang lipatan. Pre-selling = ibinebenta habang ginagawa pa o bago pa matapos."},
{q:"Ano ang pagkakaiba ng Reservation Fee at Monthly Amortization?",o:["Pareho silang monthly payment","Ang Reservation Fee ay initial payment para ma-hold ang specific unit; ang Monthly Amortization ay regular na hulog sa financing institution","Ang Reservation Fee ang full payment ng bahay","Ang Monthly Amortization ang pang-reserve ng unit"],a:1,e:"Reservation fee = pang-secure ng unit. Amortization = regular na hulog sa loan."},
{q:"Ano ang pagkakaiba ng End Lot at Corner Lot?",o:["Pareho lang sila, magkaiba lang ng tawag","Ang End Lot ay nasa dulo ng row; may kapitbahay sa tabi pero may space o firewall sa pagitan. Ang Corner Lot ay nasa kanto ng dalawang kalsada","Ang End Lot ay nasa kanto; ang Corner Lot ay nasa gitna ng row","Ang Corner Lot ay laging pinakamaliit na lote"],a:1,e:"End lot = dulo ng row. May kapitbahay pa rin sa tabi, pero may space o firewall sa pagitan kaya mas maaliwalas. Corner lot = kanto ng dalawang kalsada, kaya dalawang side ang nakaharap sa daan. Kadalasan mas mahal ang dalawa kaysa inner lot."},
{q:"Ano ang ibig sabihin ng TCP?",o:["Total Cash Payment","Total Contract Price","Transfer Cost Payment","Title Clearance Price"],a:1,e:"TCP = Total Contract Price, ang kabuuang presyo ng property ayon sa kontrata."},
{q:"Ang monthly amortization ay ₱10,000. Gamit ang 35% gross income benchmark, magkano ang required gross monthly salary?",o:["₱15,000","₱20,000","₱28,572","₱35,000"],a:2,e:"₱10,000 ÷ 0.35 ≈ ₱28,572."},
{q:"TCP ay ₱2,000,000 at ₱200,000 ang equity. Kung fully financed ang balance, magkano ang estimated loan?",o:["₱1,000,000","₱1,500,000","₱1,800,000","₱2,200,000"],a:2,e:"₱2,000,000 − ₱200,000 = ₱1,800,000."},
{q:"35 years old ang buyer at qualified sa 30-year term. Ilang taon siya pagkatapos ng loan?",o:["55","60","65","70"],a:2,e:"35 + 30 = 65. Kaya mahalaga ang age-at-maturity requirement."},
{q:"Ano ang epekto kapag tumaas ang annual interest rate, pareho ang loan amount at term?",o:["Bababa ang monthly amortization","Generally, tataas ang monthly amortization","Bababa ang loan principal","Iikli ang term"],a:1,e:"Mas mataas na rate = mas mataas na monthly payment, kung pareho ang principal at term."},
{q:"Ano ang pagkakaiba ng Lot Area at Floor Area?",o:["Pareho lang sila","Ang Lot Area ay sukat ng lupa; ang Floor Area ay sukat ng loob ng bahay (lahat ng palapag)","Ang Lot Area ay sukat ng bahay; ang Floor Area ay sukat ng garahe","Ang Floor Area ay laging mas malaki sa Lot Area"],a:1,e:"Lot area = lupa. Floor area = sukat ng bahay mismo. Sa 2-storey, puwedeng mas malaki ang floor area kaysa lot area."},
{q:"Ang mas maikling loan term ay generally mas mataas ang monthly amortization pero mas mababa ang total interest (pareho ang principal at rate).",o:TF,a:0,tf:1,e:"Tama. Mas mabilis mabayaran ang principal, kaya mas kaunti ang interest na naiipon."}]},
{name:"Intermediate",desc:"Objection handling at buyer assessment",qs:[
{q:"Sabi ng buyer: “Mahal po pala. May mas mura ba?” Ano ang pinakamagandang unang tugon?",o:["Agad mag-offer ng discount","Itanong ang budget at monthly comfort niya, tapos i-compare ang value at payment terms","Sabihing wala nang mas mura","Iwasan ang topic at lumipat ng ibang unit"],a:1,e:"Alamin muna ang totoong budget at priorities bago mag-offer. Hindi solusyon ang agad na discount."},
{q:"Sabi ng buyer: “Pag-iisipan ko muna.” Ano ang pinakamahusay na gawin?",o:["Hayaan at huwag nang mag-follow up","Pilitin siyang mag-reserve ngayon","Itanong nang magalang kung anong specific na detalye ang gusto pa niyang linawin, at mag-set ng follow-up schedule","Bawasan agad ang presyo"],a:2,e:"Hanapin ang unresolved concern, huwag pilitin, at mag-agree sa follow-up para bukas pa ang usapan."},
{q:"Buyer: ₱30,000 ang sahod, tinatanong kung pasok ang ₱10,000 amortization. Ano ang tamang sagot?",o:["Hindi pasok","Pasok at approved na siya","Pasok sa 35% benchmark (mga 33% ng sahod), pero estimate pa lang ito at depende pa sa ibang utang at sa approval ng Pag-IBIG o bank","Huwag nang sagutin"],a:2,e:"₱10,000 ÷ ₱30,000 ≈ 33%, pasok sa 35%. Ang Pag-IBIG o bank pa rin ang magdedesisyon."},
{q:"Sabi ng buyer: “Kausapin ko muna si misis/mister.” Ano ang pinakamagandang gawin?",o:["Sabihing sayang ang unit kung hindi pa siya magdedesisyon","Igalang ito, i-offer na isama ang asawa sa tripping o video call, at magpadala ng malinaw na summary ng computation","Huwag nang mag-follow up","Sabihing ikaw na lang ang kakausap sa asawa niya nang hindi niya alam"],a:1,e:"Desisyon ng pamilya ang pagbili ng bahay. Isama ang asawa sa usapan at bigyan sila ng summary na madaling pag-usapan."},
{q:"Buyer: “Separated na kami ng asawa ko. Makakakuha pa rin ba ako ng bahay sa Pag-IBIG?”",o:["Hindi na, bawal ang separated","Automatic na single na siya kapag matagal nang separated","Posible, pero kung walang annulment, legally married pa rin siya, kaya kadalasan kailangan pa rin ang consent o pirma ng asawa. I-verify sa developer kung puwede siyang mag-avail nang walang consent ng spouse","Kailangan muna niyang magpakasal ulit"],a:2,e:"Hangga't walang annulment o court decision, kasal pa rin sila sa batas. Ang tinatawag na property regime ay ang patakaran kung kanino ang ari-arian ng mag-asawa (halimbawa, conjugal), kaya madalas kailangan ang asawa sa dokumento. I-verify din sa developer kung puwede siyang mag-avail kahit walang consent ng spouse."},
{q:"Bagong agent ka. Anong project ang dapat mong unang i-post o i-focus?",o:["Lahat ng project ng developer para maraming choices","Ang project na malapit sa'yo, at mag-focus muna sa isang project hanggang kabisado mo na ito","Ang pinakamahal na project para malaki ang commission","Kahit ano, palit-palit araw-araw"],a:1,e:"Mas madali kang magpa-tripping at sumagot nang tama kung malapit at kabisado mo ang project. Kapag naka-focus ka sa isa, mas malinaw ang posts mo at mas mabilis kang nakikilala bilang expert doon."},
{q:"Anong impormasyon ang dapat mong alamin para malaman kung qualified ang buyer sa isang unit?",o:["Ang paborito niyang kulay ng bahay","Ang age at basic salary niya, para makita kung pasok siya sa income requirement at loan term ng gusto niyang unit","Ilan ang kaibigan niyang bumili na","Wala, ang lender na ang bahala"],a:1,e:"Ang age ang nagsasabi kung gaano kahaba ang puwedeng term, at ang basic salary ang nagsasabi kung kaya niya ang monthly. Itanong ito nang magalang bago mag-recommend ng unit."},
{q:"Ayaw sabihin ng buyer ang exact salary niya. Ano ang pinakamagandang approach?",o:["Tanggihan siyang pagsilbihan","Igalang ang privacy, itanong ang comfortable monthly budget (hal. payment ranges) at existing obligations, tapos i-explain na kailangan ng income verification sa actual loan","Hulaan ang sahod niya","Ibigay ang pinakamurang unit"],a:1,e:"Payment ranges ang alternatibo sa exact salary. Hindi kailangang pilitin ang buyer."},
{q:"Paano mag-follow up sa buyer nang hindi nagmumukhang pushy?",o:["Mag-message nang paulit-ulit hanggang sumagot","Sabihing mauubusan siya kung hindi pa siya magre-reserve","Mag-follow up nang may dahilan, gaya ng bagong update, sagot sa tanong niya, o simpleng kumusta, tapos bigyan siya ng space na sumagot","Huwag nang mag-follow up para hindi makaistorbo"],a:2,e:"Ang magandang follow-up ay may dalang value at walang pressure. Halimbawa: “Hi po! May bagong RFO units po kaming in-update ngayong week, baka gusto niyo pong makita.”"},
{q:"Puwedeng mangako ang agent ng discount o promo na hindi pa approved ng developer para lang makapag-reserve ang buyer.",o:TF,a:1,tf:1,e:"Mali. Official at approved na promo lang ang puwedeng ialok. Ang maling pangako ay sisira sa tiwala at puwedeng magdulot ng reklamo."}]},
{name:"Advanced",desc:"Mahihirap na sitwasyon at diskarte",qs:[
{q:"Self-employed ang buyer at walang payslip. Ano ang tamang gawin?",o:["Sabihing hindi siya puwedeng mag-loan","Itanong ang ibang proof of income gaya ng ITR, business permit o DTI, at bank statements, para ma-assess kung qualified siya","Gumawa ng pekeng payslip para sa kanya","Ipilit na cash ang bayad"],a:1,e:"Puwedeng mag-loan ang self-employed. Iba lang ang documents na kailangan bilang patunay ng kita."},
{q:"First time mong magpa-tripping at hindi mo pa kabisado ang project. Ano ang pinakamagandang gawin?",o:["Ituloy mag-isa at hulaan na lang ang mga sagot","Ikansela ang tripping","Magpa-assist sa team leader o senior agent para tama ang impormasyon at maayos ang karanasan ng buyer","Ipadala na lang ang buyer nang mag-isa sa site"],a:2,e:"Mas mahalaga ang tamang sagot kaysa magmukhang alam ang lahat. Habang may assist ka, natututo ka rin para sa susunod mong tripping."},
{q:"Seen-zone ang buyer pagkatapos mong ipadala ang computation. Ano ang tamang follow-up?",o:["Mag-message araw-araw hanggang sumagot","Hayaan na lang at huwag nang mag-follow up","Mag-follow up pagkalipas ng 1–2 araw gamit ang magaan na tanong o bagong impormasyon, walang pressure","Magalit dahil hindi siya sumasagot"],a:2,e:"Halimbawa: “Hi po! Nakita niyo na po ba ang computation? Kung may hindi malinaw, sabihan niyo lang po ako.” Magaan, may dahilan para sumagot, at walang pilit."},
{q:"Kapag nag-request ang buyer, dapat agad ibigay ng agent ang pin location ng site para makapunta siya kahit mag-isa.",o:TF,a:1,tf:1,e:"Mali. Huwag basta magbigay ng pin location. Baka ma-steal pa ang buyer ng ibang agent na naroon sa site. Mag-set ng tripping schedule at mag-meet kayo sa agreed na meeting point para kasama ka niya pagdating."},
{q:"Ano ang magandang paraan para itanong sa buyer ang marital status niya?",o:["Diretsong itanong kung bakit hindi pa siya kasal","Ipaliwanag muna kung bakit kailangan, halimbawa: “Para po ma-check natin ang requirements, married, single, o separated po ba kayo?”","Huwag na lang itanong kahit kailangan","Hulaan base sa profile picture niya"],a:1,e:"Kapag alam ng buyer kung bakit tinatanong, hindi siya mao-offend. Kailangan ang marital status para sa documents at para malaman kung kailangan ang pirma ng asawa."},
{q:"Sabi ng buyer: “Mas mura sa kabilang developer.” Ano ang tamang sagot?",o:["Siraan ang kabilang developer","Huwag siraan; i-compare nang patas ang lot at floor area, inclusions, location, payment terms, at total cost","Sabihing mas mura rin dito kahit hindi totoo","Huwag nang sumagot"],a:1,e:"Ang patas na comparison ang nagpapakita ng tunay na value. Ang paninira ay nakakababa ng tiwala sa'yo."},
{q:"OFW na gustong mag-reserve habang nasa abroad. Ano ang pinakamagandang unang gawin?",o:["Ipadala ang bayad sa personal account ng agent","Itanong kung may representative siya dito sa Pilipinas na puwedeng mag-tripping para sa kanya at mag-reserve kapag nagustuhan niya","Hintayin siyang umuwi bago mag-usap","Sabihing hindi puwede ang OFW"],a:1,e:"Ang representative ang magiging mata niya sa site. Kapag magre-reserve na, gamitin ang SPA at official payment channels lang ng developer."},
{q:"Naghahanap ang buyer ng house and lot sa Metro Manila na ₱10,000 pababa ang monthly. Ano ang tamang sagot?",o:["Sabihing meron kahit wala","Maging honest na halos wala nang ganyang house and lot sa Metro Manila, tapos mag-offer ng options sa Cavite na pasok sa budget at ipakita ang biyahe papunta sa Manila","Sabihing mag-ipon na lang muna siya","Huwag nang sagutin ang inquiry"],a:1,e:"Ang honesty ang nagpapatibay ng tiwala. Ipakita ang pinakamalapit na option na totoong pasok sa budget niya."},
{q:"Kapag nakapag-reserve na ang buyer, tapos na ang trabaho ng agent.",o:TF,a:1,tf:1,e:"Mali. Kasama pa rin ang agent sa pagkumpleto ng documents, loan approval, at hanggang turnover. Dito nanggagaling ang referrals."},
{q:"Sa official account o payment channel lang ng developer dapat ibayad ang reservation fee, at dapat may official receipt.",o:TF,a:0,tf:1,e:"Tama. Pinoprotektahan nito ang buyer at ang agent laban sa scam at problema sa records."}]}
];

const EXP={
B1:"<b>RFO (Ready for Occupancy)</b> ay <b>tapos na at puwede nang lipatan</b> agad pagkatapos ma-approve ang loan. <b>Pre-selling</b> naman ay <b>ibinebenta habang ginagawa pa</b>, kaya karaniwang <b>mas mura</b> at <b>mas mahaba ang equity terms</b>, pero maghihintay ang buyer bago makalipat.<br><br>💡 <b>Tip:</b> RFO para sa buyer na <b>kailangan nang lumipat</b>; Pre-selling para sa buyer na <b>may oras pang maghintay</b> at gustong mas magaan ang hulog.",
B2:"Ang <b>Reservation Fee</b> ay <b>maliit na initial payment para ma-HOLD ang specific na unit</b> para hindi na ito maibenta sa iba. Kadalasan ay <b>NON-REFUNDABLE</b> ito at ibinabawas sa equity o TCP.<br><br>Ang <b>Monthly Amortization</b> ay ang <b>BUWANANG HULOG sa loan</b> (Pag-IBIG, bank o in-house) pagkatapos ma-release ang loan, kadalasan sa loob ng <b>15 hanggang 30 taon</b>.",
B3:"<b>END LOT</b>: nasa <b>DULO ng row</b>. May kapitbahay pa rin sa tabi, pero may <b>SPACE o FIREWALL</b> sa pagitan, kaya mas maaliwalas at may extra na hangin at liwanag.<br><br><b>CORNER LOT</b>: nasa <b>KANTO ng DALAWANG KALSADA</b>, kaya dalawang side ang nakaharap sa daan.<br><br>💡 Parehong <b>mas mahal kaysa INNER LOT</b> dahil sa dagdag na space at privacy.",
B4:"<b>TCP = TOTAL CONTRACT PRICE</b>, ang <b>KABUUANG PRESYO</b> ng property ayon sa kontrata. Dito ibinabase ang computation ng <b>reservation, equity o down payment, at loan amount</b>.<br><br>💡 Laging banggitin ang TCP kapag nagbibigay ng computation para malinaw sa buyer ang buong presyo.",
B5:"Ang <b>35% rule</b> ay nangangahulugang <b>hindi dapat lumampas sa 35% ng GROSS MONTHLY INCOME</b> ang monthly amortization.<br><br><b>Formula:</b> Monthly Amortization <b>÷ 0.35</b> = Required Gross Salary<br><b>Computation:</b> ₱10,000 ÷ 0.35 = <b>₱28,571.43</b>, i-round up sa <b>₱28,572</b>.<br><br>✅ Check: ₱28,572 × 0.35 = ₱10,000. Ibig sabihin, <b>kailangan ng sahod na mga ₱28,572 pataas</b> para pasok sa ₱10,000 na monthly.",
B6:"Ang <b>LOAN AMOUNT</b> ay ang <b>natitirang balance</b> pagkatapos ibawas ang equity o down payment sa TCP.<br><br><b>Formula:</b> TCP <b>−</b> Equity = Loan Amount<br><b>Computation:</b> ₱2,000,000 − ₱200,000 = <b>₱1,800,000</b><br><br>💡 <b>Mas malaki ang equity = mas maliit ang loan = mas mababa ang monthly.</b>",
B7:"<b>Formula:</b> Edad ngayon <b>+</b> Loan Term = Edad pagkatapos ng loan<br><b>Computation:</b> 35 + 30 = <b>65 years old</b><br><br>💡 Mahalaga ito dahil may <b>MAXIMUM AGE sa pagtatapos ng loan</b> (sa Pag-IBIG, hanggang <b>70 years old</b>). Kaya <b>mas matanda ang buyer, mas maikli ang puwedeng term</b>, at mas mataas ang monthly.",
B8:"Ang <b>INTEREST</b> ay ang bayad sa paghiram ng pera. Kapag <b>TUMAAS ang interest rate</b> at pareho ang loan amount at term, <b>TATAAS ang MONTHLY AMORTIZATION</b>, dahil mas malaki ang interest sa bawat hulog.<br><br>💡 Kaya mahalagang ipaliwanag sa buyer ang <b>fixed period</b> at <b>repricing</b> ng rate.",
B9:"<b>LOT AREA</b> = sukat ng <b>LUPA</b>.<br><b>FLOOR AREA</b> = sukat ng <b>BAHAY mismo</b>, kasama ang lahat ng palapag.<br><br>Halimbawa: 2-storey sa <b>40 sqm na lote</b> na may <b>22 sqm bawat palapag</b> ay may <b>44 sqm na floor area</b>. Puwedeng <b>MAS MALAKI ang floor area kaysa lot area</b> kapag 2-storey.",
B10:"<b>TAMA.</b> Sa <b>mas maikling term</b>, mas malaki ang bahagi ng principal na binabayaran bawat buwan, kaya <b>MAS MATAAS ang MONTHLY</b>. Pero dahil <b>mas kaunting taon na umiikot ang interest</b>, <b>MAS MALIIT ang KABUUANG INTEREST</b> na babayaran.<br><br>💡 Kung kaya ng buyer ang monthly, <b>mas makakatipid siya sa mas maikling term.</b>",
I1:"Ang <b>\"mahal\"</b> ay kadalasang ibig sabihin ay <b>\"hindi ko alam kung kaya ko\"</b>. Kaya <b>ALAMIN MUNA ang BUDGET at MONTHLY COMFORT</b> niya bago mag-offer ng kahit ano.<br><br>Halimbawa: <i>\"Para po mahanap natin ang pasok sa inyo, magkano po ang komportableng monthly para sa inyo?\"</i><br><br>❌ Huwag mag-offer agad ng discount; nababawasan ang value ng property at commission mo.",
I2:"Ang <b>\"Pag-iisipan ko muna\"</b> ay kadalasang may <b>HINDI PA NALILINAW</b> na concern: presyo, location, financing, o asawa.<br><br>✅ <b>Gawin:</b> 1) Itanong nang magalang kung <b>ANONG DETALYE</b> ang gusto pa niyang malaman. 2) Sagutin iyon. 3) <b>MAG-SET ng FOLLOW-UP</b> date.<br><br>Halimbawa: <i>\"Sige po! May part po ba na gusto niyong linawin ko? Okay lang po ba kung balikan ko kayo sa Sabado?\"</i>",
I3:"<b>Computation:</b> ₱10,000 ÷ ₱30,000 = <b>0.333 o 33.3%</b> ng sahod.<br>Dahil <b>mas mababa sa 35%</b>, <b>PASOK</b> siya sa benchmark.<br><br>⚠️ Pero <b>ESTIMATE PA LANG</b> ito. Titingnan pa ng <b>Pag-IBIG o bank</b> ang ibang utang, documents, at credit history niya. <b>Huwag sabihing \"approved ka na.\"</b>",
I4:"Ang pagbili ng bahay ay <b>DESISYON ng PAMILYA</b>. Huwag itong labanan; <b>ISAMA ang asawa</b> sa usapan.<br><br>✅ <b>Gawin:</b> 1) I-invite ang mag-asawa sa <b>TRIPPING</b> o <b>video call</b>. 2) Magpadala ng <b>MALINAW na SUMMARY</b> ng computation na madali nilang pag-usapan. 3) Mag-follow up pagkatapos ng ilang araw.",
I5:"Ang <b>\"separated\"</b> ay <b>HINDI legal na status</b>. Hangga't walang <b>ANNULMENT</b> o court decision, <b>KASAL PA RIN</b> sila sa batas.<br><br>Ang <b>PROPERTY REGIME</b> ay ang patakaran kung <b>kanino ang ari-arian ng mag-asawa</b> (halimbawa, conjugal), kaya madalas <b>kailangan ang PIRMA o CONSENT ng asawa</b>.<br><br>✅ <b>I-VERIFY sa DEVELOPER</b> kung puwede siyang mag-avail nang walang consent ng spouse.",
I6:"Bilang bagong agent, <b>MAG-FOCUS sa ISANG PROJECT MUNA</b>, mas mabuti kung <b>MALAPIT sa'yo</b>.<br><br><b>Bakit?</b> 1) <b>Madali kang magpa-tripping</b>. 2) <b>Makakabisado mo</b> ang presyo, units, at terms. 3) Mas <b>malinaw ang mga post mo</b>, kaya makikilala ka bilang <b>EXPERT</b> sa project na iyon.<br><br>💡 Kapag kabisado mo na ito, saka magdagdag ng ibang project.",
I7:"Dalawang pinakamahalagang tanong: <b>AGE</b> at <b>BASIC SALARY</b>.<br><br><b>AGE</b> → para malaman kung <b>GAANO KAHABA ang puwedeng loan term</b> (hal. 40 years old → hanggang 30 years sa Pag-IBIG, dahil max 70).<br><b>BASIC SALARY</b> → para malaman kung <b>KAYA NIYA ang MONTHLY</b> gamit ang 35% rule.<br><br>💡 Itanong ito nang magalang <b>BAGO mag-recommend ng unit</b>.",
I8:"<b>IGALANG ang PRIVACY</b> ng buyer. Hindi mo kailangan ang eksaktong sahod sa simula.<br><br>✅ <b>Itanong na lang:</b> <i>\"Magkano po ang komportableng monthly para sa inyo? May iba pa po ba kayong binabayarang loan?\"</i><br><br>Ipaliwanag din na sa actual na loan application, <b>kakailanganin ang INCOME DOCUMENTS</b> para ma-verify.",
I9:"Ang magandang follow-up ay <b>MAY DALANG VALUE</b> at <b>WALANG PRESSURE</b>.<br><br>✅ <b>May dahilan:</b> bagong update, bagong RFO, sagot sa tanong niya, o simpleng kumusta.<br>✅ <b>Bigyan ng SPACE</b>: 1–3 araw sa pagitan ng follow-ups.<br>❌ <b>Iwasan:</b> araw-araw na \"Ano na po?\" o pananakot na mauubusan.<br><br>Halimbawa: <i>\"Hi po! May bagong RFO units po kami ngayong week, baka gusto niyo pong makita.\"</i>",
I10:"<b>MALI.</b> <b>OFFICIAL at APPROVED na promo LANG</b> ng developer ang puwedeng ialok.<br><br>Ang <b>maling pangako</b> ay puwedeng mauwi sa <b>REKLAMO</b>, <b>pagkansela ng buyer</b>, at <b>pagkasira ng tiwala</b> sa'yo at sa team. Kung hindi sigurado, <b>i-verify muna sa team leader o developer.</b>",
A1:"<b>PUWEDENG MAG-LOAN ang SELF-EMPLOYED</b>. Iba lang ang patunay ng kita nila.<br><br>✅ <b>Karaniwang hinihingi:</b> <b>ITR</b> (Income Tax Return), <b>Business Permit o DTI Registration</b>, at <b>BANK STATEMENTS</b> (kadalasan 6 na buwan).<br><br>💡 I-check sa developer o lender ang <b>eksaktong requirements</b>, dahil puwedeng mag-iba ito.",
A2:"Sa <b>UNANG TRIPPING</b>, mas mahalaga ang <b>TAMANG IMPORMASYON</b> kaysa magmukhang alam mo ang lahat.<br><br>✅ <b>MAGPA-ASSIST sa TEAM LEADER o SENIOR AGENT</b> para:<br>1) <b>Tama ang sagot</b> sa mga tanong ng buyer.<br>2) <b>Hindi mawala o ma-steal</b> ang buyer.<br>3) <b>Natututo ka</b> para sa susunod mong tripping.",
A3:"Ang <b>seen-zone</b> ay <b>HINDI ibig sabihing ayaw na</b> ng buyer. Kadalasan ay <b>busy, nag-iisip, o nalilito</b> pa siya.<br><br>✅ <b>Mag-follow up after 1–2 ARAW</b> gamit ang <b>MAGAAN na tanong</b> na madaling sagutin.<br><br>Halimbawa: <i>\"Hi po! Nakita niyo na po ba ang computation? Kung may hindi malinaw, sabihan niyo lang po ako.\"</i>",
A4:"<b>MALI.</b> <b>Huwag basta magbigay ng PIN LOCATION.</b> Kapag pumunta ang buyer nang mag-isa, <b>puwede siyang ma-STEAL ng ibang agent</b> na naroon sa site.<br><br>✅ <b>Gawin:</b> Mag-set ng <b>TRIPPING SCHEDULE</b> at mag-meet kayo sa <b>agreed na MEETING POINT</b>, para <b>KASAMA KA niya</b> pagdating sa site.",
A5:"Kapag alam ng buyer <b>KUNG BAKIT</b> tinatanong, <b>hindi siya mao-offend</b>.<br><br>✅ <b>Halimbawa:</b> <i>\"Para po ma-check natin ang requirements, married, single, o separated po ba kayo?\"</i><br><br>💡 Kailangan ang <b>MARITAL STATUS</b> para sa <b>DOCUMENTS</b> at para malaman kung <b>kailangan ang PIRMA ng ASAWA</b>.",
A6:"<b>HUWAG SIRAAN</b> ang kabilang developer; <b>bumababa ang tiwala sa'yo</b> kapag ginawa mo ito.<br><br>✅ <b>I-COMPARE nang PATAS:</b> <b>lot at floor area</b>, <b>inclusions</b> (hal. fence, tiles, kitchen), <b>location</b>, <b>payment terms</b>, at <b>TOTAL COST</b>.<br><br>💡 Kadalasan, ang \"mas mura\" ay <b>mas maliit</b> o <b>kulang ang inclusions</b>.",
A7:"Unang itanong: <b>May REPRESENTATIVE ba siya dito sa Pilipinas</b> na puwedeng <b>MAG-TRIPPING</b> para sa kanya?<br><br>Ang representative ang magiging <b>MATA niya sa site</b>. Kapag nagustuhan, siya na rin ang puwedeng <b>MAG-RESERVE</b>.<br><br>⚠️ Gamitin ang <b>SPA (Special Power of Attorney)</b> at <b>OFFICIAL PAYMENT CHANNELS</b> lang ng developer. <b>Huwag sa personal account.</b>",
A8:"<b>MAGING HONEST.</b> Halos <b>WALA nang HOUSE AND LOT sa Metro Manila</b> na ₱10,000 pababa ang monthly.<br><br>✅ <b>Gawin:</b> 1) Sabihin ito nang magalang. 2) Mag-offer ng <b>2–3 options sa CAVITE</b> na <b>PASOK sa BUDGET</b>. 3) Ipakita ang <b>biyahe papuntang Manila</b> para makita niyang kaya.<br><br>💡 Ang honesty ang <b>nagpapatibay ng TIWALA</b>.",
A9:"<b>MALI.</b> Ang reservation ay <b>SIMULA PA LANG</b>. Kasama pa rin ang agent sa:<br>1) <b>Pagkumpleto ng DOCUMENTS</b><br>2) <b>LOAN APPLICATION at APPROVAL</b><br>3) <b>TURNOVER</b> ng unit<br><br>💡 Dito nanggagaling ang <b>REFERRALS</b>. Ang buyer na maayos ang karanasan ay magre-recommend sa'yo.",
A10:"<b>TAMA.</b> Ibayad lang ang reservation fee sa <b>OFFICIAL ACCOUNT o PAYMENT CHANNEL ng DEVELOPER</b>, at laging humingi ng <b>OFFICIAL RECEIPT</b>.<br><br>💡 Pinoprotektahan nito ang <b>buyer laban sa SCAM</b>, at ang <b>agent laban sa problema sa RECORDS</b>. <b>Huwag tumanggap ng bayad sa personal account.</b>"};

function save(){try{localStorage.setItem(KEY,JSON.stringify({agent,unlocked,passed}))}catch(e){}}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function nameScreen(){app.innerHTML=`<p class="tag">TEAM EMPRESS</p><h1>Empress Academy</h1><p class="sub">Ilagay ang pangalan mo para masimulan ang training.</p><input id="nm" placeholder="Buong pangalan" style="width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:12px"><button class="btn" id="go">Simulan</button>`;
const nm=document.getElementById("nm");nm.focus();const go=()=>{const v=nm.value.trim();if(!v){nm.focus();return}agent=v;save();home()};document.getElementById("go").onclick=go;nm.onkeydown=e=>{if(e.key==="Enter")go()}}
let agent="",unlocked=0,passed=[],cur=null,idx=0,score=0,miss=[],items=[],answered=false;
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function prep(q){if(q.tf)return{...q,opts:q.o.map((t,i)=>({t,c:i===q.a}))};return{...q,opts:sh(q.o.map((t,i)=>({t,c:i===q.a})))}}
function home(){cur=null;
let h=`<p class="tag">TEAM EMPRESS</p><h1>Empress Academy</h1><p class="sub">Agent: <b>${esc(agent)}</b> · <a href="#" id="chg" style="color:var(--pri)">palitan</a></p><p class="sub">Three levels, 10 questions each. Score a perfect 10/10 to unlock the next level, and finish all three to earn your Certificate of Completion.</p><div class="levels">`;
L.forEach((l,i)=>{const lock=i>unlocked,done=passed.includes(i);
h+=`<button class="lv ${done?"done":""}" ${lock?"disabled":""} data-i="${i}"><span><b>${l.name}</b><small>${l.desc}</small></span><span class="st">${done?"Perfect ✓":lock?"Naka-lock":"Simulan"}</span></button>`});
h+="</div>";
if(passed.length===3)h+=`<div class="exp"><b>Congratulations!</b> Tapos mo na ang buong training. <button class="btn" id="cv" style="margin-top:10px">Tingnan ang certificate</button></div>`;

app.innerHTML=h;const cv=document.getElementById("cv");if(cv)cv.onclick=cert;document.getElementById("chg").onclick=e=>{e.preventDefault();agent="";unlocked=0;passed=[];save();nameScreen()};app.querySelectorAll(".lv").forEach(b=>b.onclick=()=>start(+b.dataset.i))}

function cert(){let d=localStorage&&0;let dt;try{dt=localStorage.getItem("etg-date")}catch(e){}if(!dt){dt=new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});try{localStorage.setItem("etg-date",dt)}catch(e){}}
let no;try{no=localStorage.getItem("etg-no")}catch(e){}if(!no){no="EA-"+new Date().getFullYear()+"-"+Math.random().toString(36).slice(2,7).toUpperCase();try{localStorage.setItem("etg-no",no)}catch(e){}}
app.innerHTML=`<div class="cert"><img class="wm" src="${EMP}" alt=""><div class="logos"><img class="z" src="${ZON}" alt="Zonal Realty"></div><div class="k">TEAM EMPRESS</div><h2>Certificate of Completion</h2><div class="rule"></div><p style="margin:10px 0 0">This certificate is proudly presented to</p><div class="nm">${esc(agent)}</div><p style="margin:8px 0;white-space:nowrap;font-size:clamp(.62rem,3.3vw,1rem)">for successfully completing, with perfect scores, the</p><b style="font:700 1rem Georgia,serif">Empress Academy</b><div class="rule"></div><p style="font-size:.88rem;margin:4px 0 0">Ready for supervised selling and buyer conversations.</p><div class="foot"><div class="sg"><img src="${SIG}" alt="Signature"><div><b>Florence Christine Alvarez</b><br>Team Empress</div></div><div class="dt"><span>Date Completed</span><b>${dt}</b></div></div><div class="no">Certificate No. ${no}</div></div>
<p class="sub" style="text-align:center">I-screenshot ang certificate at ipadala sa team leader mo.</p><button class="btn alt" id="bk">Bumalik sa menu</button>`;document.getElementById("bk").onclick=home}
function start(i){cur=i;idx=0;score=0;miss=[];items=sh(L[i].qs.map((q,k)=>({...q,code:L[i].name[0]+(k+1)}))).map(prep);show()}
function show(){answered=false;const q=items[idx];
app.innerHTML=`<div class="meta"><span>${L[cur].name}</span><span>Tanong ${idx+1} ng 10 · Score: ${score}</span></div><div class="bar"><i style="width:${idx*10}%"></i></div>
<span class="tag">${q.code} · ${q.tf?"True / False":"Multiple Choice"}</span><p class="q">${q.q}</p><div id="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.t}</button>`).join("")}</div><div id="fb"></div>`;
app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.i))}
function pick(i){if(answered)return;answered=true;const q=items[idx],ok=q.opts[i].c;
if(ok)score++;else miss.push(q);
app.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(q.opts[k].c)b.classList.add("ok");else if(k===i)b.classList.add("no")});
document.getElementById("fb").innerHTML=`<div class="exp"><b>${ok?"Tama!":"Mali."}</b>${ok?"":` <span style="color:var(--ok)">Tamang sagot: ${q.opts.find(o=>o.c).t}.</span>`} ${q.e}</div><button class="btn" id="nx">${idx<9?"Susunod":"Tingnan ang resulta"}</button>`;
document.getElementById("nx").onclick=()=>{idx++;idx<10?show():finish()};document.getElementById("nx").focus()}
function finish(){const perfect=score===10,last=cur===2;
if(perfect&&!passed.includes(cur)){passed.push(cur);if(cur<2)unlocked=Math.max(unlocked,cur+1);save()}
let h=`<div class="res"><div class="n">${score}/10</div><p><b>${perfect?(last?"Perfect! Tapos mo na ang buong training.":"Perfect! Na-unlock mo na ang susunod na level."):"Hindi pa perfect. Kailangan ng 10/10 para makausad."}</b></p></div>`;
if(!perfect){h+=`<p>Mga tanong na kailangan mong balikan:</p><ul class="rev">${miss.map(q=>`<li><b>${q.q}</b><br><span style="color:var(--ok)">✓ Tamang sagot: ${q.opts.find(o=>o.c).t}</span><br>${q.e}</li>`).join("")}</ul>`}
h+=`<button class="btn" id="a">${perfect&&!last?"Susunod na level":perfect?(passed.length===3?"Tingnan ang certificate":"Bumalik sa menu"):"Ulitin ang level"}</button> <button class="btn alt" id="b">Menu</button>`;
app.innerHTML=h;
document.getElementById("a").onclick=()=>perfect?(last?(passed.length===3?cert():home()):start(cur+1)):start(cur);
document.getElementById("b").onclick=home}
const REV=false;
function revStart(i){cur=i;idx=0;items=L[i].qs.map(q=>({...q,opts:q.o.map((t,k)=>({t,c:k===q.a}))}));revShow()}
function revShow(){const q=items[idx],code=L[cur].name[0]+(idx+1),n=items.length;
app.innerHTML=`<div class="meta"><span><b>REVIEW MODE</b> · ${L[cur].name}</span><span>${code} · ${idx+1} ng ${n}</span></div><div class="bar"><i style="width:${(idx+1)/n*100}%"></i></div>
<span class="tag">${code} · ${q.tf?"True / False":"Multiple Choice"}</span><p class="q">${q.q}</p>${q.opts.map(o=>`<div class="opt ${o.c?"ok":""}">${o.c?"✅ ":""}${o.t}</div>`).join("")}<div class="exp"><b>Paliwanag:</b> ${q.e}</div>
<button class="btn alt" id="pv" ${idx===0?"disabled":""}>‹ Bumalik</button> <button class="btn" id="nx">${idx<n-1?"Susunod ›":(cur<L.length-1?"Next level ›":"Tapos")}</button> <button class="btn alt" id="mn">Menu</button>`;
document.getElementById("pv").onclick=()=>{idx--;revShow()};
document.getElementById("nx").onclick=()=>{if(idx<n-1){idx++;revShow()}else if(cur<L.length-1)revStart(cur+1);else revHome()};
document.getElementById("mn").onclick=revHome}
function revHome(){let h=`<p class="tag">TEAM EMPRESS · REVIEW MODE</p><h1>Empress Academy</h1><p class="sub">Para sa pag-review at pag-edit. Bukas lahat ng level, may tamang sagot at paliwanag na agad, at puwedeng mag-next o bumalik nang hindi sumasagot.</p><div class="levels">`;
L.forEach((l,i)=>h+=`<button class="lv" data-i="${i}"><span><b>${l.name}</b><small>${l.desc} · ${l.qs.length} questions</small></span><span class="st">Review</span></button>`);
app.innerHTML=h+"</div>";app.querySelectorAll(".lv").forEach(b=>b.onclick=()=>revStart(+b.dataset.i))}

if(REV)revHome();else{load();agent?home():nameScreen();}
</script></body></html>
